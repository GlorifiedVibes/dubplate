# Builds release packages when a version tag is pushed: v0.1.0, v0.2.0, ...
# The packages hold the app and the stem-engine installer, never a model or a runtime
# (those are downloaded on the user's machine by the installer script).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,  archive: tar.gz }
          - { os: windows-latest, name: windows-x86_64, archive: zip }
          - { os: macos-latest,   name: macos-arm64,   archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dubplate --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          d=dubplate-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$d"
          cp target/release/dubplate "$d/"
          cp scripts/setup_onnx.sh "$d/"
          cp docs/install.md "$d/INSTALL.md"
          tar -czf "$d.tar.gz" "$d"
          echo "ASSET=$d.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "dubplate-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target\release\dubplate.exe $d\
          Copy-Item scripts\setup_onnx.ps1 $d\
          Copy-Item docs\install.md $d\INSTALL.md
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          "ASSET=$d.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
